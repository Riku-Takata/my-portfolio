  title: projects コレクションと仮原稿2件、原稿の雛形
  milestone: M2
  request: '詳細設計「データとコンテンツ > プロジェクト」と「本文の書き方」「原稿がそろうまで」に従う。@astrojs/mdx を入れ、src/content.config.ts に projects コレクション(glob loader: src/content/projects/*.mdx、schema は lib/schemas.ts の projectSchema)を定義する。仮原稿 src/content/projects/satellite-insar.mdx と rag-knowledge-base.mdx を置く。frontmatter は有効な値にし(2件とも featured: true、order は 1 と 2)、本文と frontmatter の要所に TODO(content) を入れる。本文は素案4章の見出し(## 1. 概要 & 解決したい課題 (Why) / ## 2. システムアーキテクチャ / ## 3. 技術選定とトレードオフ / ## 4. 技術的な課題と解決プロセス)にし、3章に GFM の表を1つ、どこかにコードブロックを1つ入れる。本文に「# 」の見出しは書かない。docs/project-template.mdx に、4章の見出しと frontmatter の例を書いた雛形を置く(素案の「# [プロジェクト名]」は取り除く)。tests/unit/content.test.ts を書く: すべての MDX の本文に行頭が「# 」の見出しがない(コードブロックの中は除く)、slug(ファイル名)が ^[a-z0-9]+(-[a-z0-9]+)*$ に合い、index でない。'
  acceptance:
