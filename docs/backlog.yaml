- id: T-009
  title: Zenn 記事のビルド時取得(zenn.ts)
  milestone: M2
  request: 詳細設計「データとコンテンツ > Zenn 記事」に従い、src/lib/schemas.ts に zennResponseSchema を足し、src/lib/zenn.ts に fetchLatestArticles(username = 'riku_takata', count = 5) を作る。取得先は https://zenn.dev/api/articles?username=<username>&order=latest&count=<count>。レスポンスを zennResponseSchema で検証し、使う値は articles[].title、slug、published_at、user.username だけにする。戻り値は { title, url, publishedAt }[] とし、url は https://zenn.dev/${username}/articles/${slug} で組み立てる。タイムアウトは10秒(AbortSignal.timeout)。通信エラー、HTTP エラー、タイムアウト、スキーマ違反のときは例外を投げず、console.warn を1回出して空の配列を返す(ビルドを止めない)。username は lib/site.ts の ZENN_USERNAME を既定値に使う。tests/unit/zenn.test.ts を fetch のモックで書く。
  acceptance:
  - 正常なレスポンスのモックで5件を返し、url が https://zenn.dev/riku_takata/articles/<slug> になる
  - HTTP 500 のとき、空の配列を返し console.warn が1回呼ばれる
  - タイムアウト(AbortError)のとき、空の配列を返し console.warn が1回呼ばれる
  - スキーマ違反(articles がない、title が数値など)のとき、空の配列を返し console.warn が1回呼ばれる
  - fetch に渡す URL に username、order=latest、count=5 が入っている
  - どのケースでも例外が外に出ない
  - npm test が通る
  depends_on:
  - T-006
  size: S
  human_check: ''
  status: todo
- id: T-010
  title: テーマ・フォント・共通 UI 部品とアイコン
