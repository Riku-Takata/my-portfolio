schema_version: '1.0'
product: my-portfolio
milestones:
- id: M1
  title: 検証の土台
  goal: renewal ブランチで旧 Next.js 版を消し、Astro の静的サイトの骨組みが動く。npm ci && npm run verify(check → lint → format:check → test → build → test:dist)がローカルと CI の両方で通る。依存の版と出典が README に記録され、デザイン規律を機械で確かめるテストが常に流れる。
- id: M2
  title: データ層
  goal: プロジェクトの MDX(Content Collections + Zod)、resume.ts、Zenn 記事のビルド時取得、整形用の純粋関数がそろい、ユニットテストで振る舞いを確かめられる。frontmatter に違反があれば astro build が失敗する。
- id: M3
  title: トップページ
  goal: / に Hero / About / Featured Projects / Technical Skills / Experience & Education / Articles と Footer が出る。BaseLayout がメタ情報とフォントと Analytics を出し、クライアント JS は Vercel Analytics だけになる。
- id: M4
  title: プロジェクト詳細ページと図
  goal: /projects/<slug>/ が全件生成され、MDX 本文が prose で組まれる。Shiki の2テーマ、表の横スクロール、手元で書き出した Mermaid の SVG を Figure で表示できる。
- id: M5
  title: OGP と SEO
  goal: ページごとの OGP PNG(1200×630)がビルド時に作られ、sitemap-index.xml と robots.txt が出る。全ページの canonical と og:image が絶対 URL で正しい。
- id: M6
  title: 運用と公開の準備
  goal: 定期再ビルドのワークフロー、公開前チェック(npm run check:release)、新しい README がそろい、開発者が原稿をそろえて main にマージできる状態になる。
- id: M7
  title: 最終確認での直し
  goal: '最終確認の PR #36 のスクリーンショットで見つかった見た目の問題(OGP の長いタイトルのはみ出し、セクションの間の余白、375px の表と図)が直り、npm run verify が通る。'
tasks:
- id: T-001
  title: 依存ライブラリと外部仕様の確認記録(T-00)
  milestone: M1
  request: '詳細設計「構成」の表で「未確認」とした項目と、「検証の方針 > Stage 0 > T-00」の一覧を、公式ドキュメントと npm レジストリで確かめ、README.md に「依存の確認記録」の節を足して、確かめた版・確かめた日・出典 URL を書く。対象: Astro / @astrojs/mdx / @astrojs/sitemap / @astrojs/check の最新の安定版、Tailwind CSS の最新の安定版と Astro での推奨の組み込み方(@tailwindcss/vite が推奨か、@astrojs/tailwind は非推奨か)、@tailwindcss/typography、@vercel/analytics の Astro 用コンポーネント(@vercel/analytics/astro)の提供の形と静的出力で動くか、satori、@resvg/resvg-js、@mermaid-js/mermaid-cli、Vitest(projects の機能)、@fontsource-variable/geist と jetbrains-mono、Lucide がブランドアイコンを含むか、ESLint の flat config と eslint-plugin-astro / typescript-eslint / prettier-plugin-astro、Astro が対応する Node の範囲(22 系 LTS でよいか)、Zenn API(https://zenn.dev/api/articles)の仕様が公開されているか、GitHub Actions の schedule が止まる条件(リポジトリが60日間動かないと止まる扱い)、Vercel の Framework Preset を Astro に変える手順と Preview の Deployment Protection。確かめられなかったものは「未確認」と書く(ナレッジ J-20261008-001)。設計の前提と違う事実が見つかったら(例: Tailwind v4 で @tailwindcss/vite が推奨でない)、README の同じ節に「設計との差」として書き、PR の説明でも知らせる。このタスクではコードを変えない。'
  acceptance:
  - README.md に「依存の確認記録」の節があり、列挙した各項目について、版(またはは結論)、確かめた日、出典 URL、または「未確認」が書かれている
  - Zenn API が公式に公開された仕様かどうかの結論が書かれている
  - GitHub Actions の schedule の停止条件についての結論と出典が書かれている
  - 設計の前提と違う点があれば「設計との差」として列挙されている(なければ「なし」と書かれている)
  - README.md 以外のファイルに変更がない
  depends_on: []
  size: S
  human_check: 出典が公式のもの(公式ドキュメント、npm、GitHub の公式リポジトリ)になっているかを目で確かめる。
  status: todo
- id: T-002
  title: 旧 Next.js 版の削除と Astro の骨組み
  milestone: M1
  request: '詳細設計「既存のコードからの移行」に従い、renewal ブランチ向けの PR で旧コードを消し、Astro の静的サイトの骨組みを入れる。消すもの: app/ 一式、components/ui/*、components.json、hooks/use-toast.ts、lib/utils.ts、styles/*.module.css、next.config.ts、tailwind.config.ts、postcss.config.mjs、eslint.config.mjs、tsconfig.json、public/ の file.svg・globe.svg・next.svg・vercel.svg・window.svg・naptop.jpg、package.json の依存すべて(package-lock.json は作り直す)。移すもの: app/icon.png → public/favicon.png(大きければ 512px 以下に縮める)。.gitignore は /.next/ と next-env.d.ts を消し、/dist/ と /.astro/ を足す(/materials、.env*、.vercel は残す)。入れるもの: T-001 で確かめた版の Astro、astro.config.mjs(output:''static''、site は lib/site.ts の SITE_URL と同じ仮の値 https://my-portfolio-riku-takata.vercel.app に TODO(content) を付ける、trailingSlash:''always''、build.format:''directory'')、src/lib/site.ts(SITE_URL、SITE_NAME、ZENN_USERNAME=''riku_takata'')、tsconfig.json(astro/tsconfigs/strict を継承)、vercel.json({ "trailingSlash": true })、.nvmrc と package.json の engines(Node 22 系 LTS)、Tailwind(「構成」の表のとおり @tailwindcss/vite を vite.plugins に入れ、src/styles/global.css は @import "tailwindcss" だけでよい)、最小の src/layouts/BaseLayout.astro(<html lang="ja">、title、meta description、color-scheme、favicon。完全な F-01 は T-011)、中身が空に近い src/pages/index.astro。npm scripts は check(astro check)と build(astro build)をこのタスクで入れる。'
  acceptance:
  - 旧コードの一覧(app/、components/ui、shadcn 関連、Next.js の設定、public の雛形画像と naptop.jpg)がリポジトリにない
  - package.json に next、react、framer-motion、radix、shadcn-ui、react-icons、recharts、sass、stylus、stylelint 系、add、tabs が入っていない
  - public/favicon.png があり、512px 以下である
  - .gitignore に /dist/ と /.astro/ があり、/.next/ がない
  - npm ci && npm run check && npm run build が通り、dist/index.html ができて <html lang="ja"> を含む
  - astro.config.mjs の site と src/lib/site.ts の SITE_URL が同じ値で、TODO(content) が付いている
  - 'vercel.json が { "trailingSlash": true } で、.nvmrc と engines が Node 22 系を指す'
  depends_on:
  - T-001
  size: M
  human_check: ''
  status: todo
- id: T-003
  title: lint・format・Vitest(unit/dist)・verify・CI の導入
  milestone: M1
  request: '詳細設計「検証の方針 > npm scripts」と「Stage 0 > T-01」に従い、検証の仕組みを入れる。ESLint(flat config の eslint.config.js、eslint-plugin-astro、typescript-eslint)、Prettier(.prettierrc、prettier-plugin-astro)、@astrojs/check、Vitest(vitest.config.ts で projects を unit = tests/unit と dist = tests/dist に分ける)。npm scripts に lint(eslint .)、format:check(prettier --check .)、test(vitest run --project unit)、test:dist(vitest run --project dist)、verify(check → lint → format:check → test → build → test:dist を順に流す)を足す。tests/dist に最小のテストを1本置く(dist/index.html があり、lang="ja" になっている)。tests/unit にも、後のタスクが足していけるよう最小のテストを1本置く(例: lib/site.ts の SITE_URL が https で始まり末尾が / でない)。.github/workflows/ci.yml を作り、push と pull_request で Node(.nvmrc の版)を入れて npm ci → check → lint → format:check → test → build → test:dist を流す。'
  acceptance:
  - npm ci && npm run verify がローカルで通る
  - PR 上で ci.yml のジョブが緑になる
  - dist/index.html を消してから npm run test:dist を流すと失敗する
  - lint に違反する .ts を src/ に置くと npm run lint が失敗する
  - 整形されていないファイルがあると npm run format:check が失敗する
  - vitest.config.ts に unit と dist の2つのプロジェクトがあり、npm test は unit だけを流す
  depends_on:
  - T-002
  size: M
  human_check: ''
  status: todo
- id: T-004
  title: デザイン規律と Zero-JS を確かめるソースのテスト
  milestone: M1
  request: '詳細設計「検証の方針 > ユニットテスト > source-rules.test.ts」を tests/unit/source-rules.test.ts として実装する。src/**/*.{astro,ts,css} を読み(MDX の本文は技術解説の英文で誤検知するので対象にしない)、次の文字列が出たら失敗にする: animate-、transition-colors 以外の transition-、duration-150 以外の duration-、bg-gradient / bg-linear / from- / via- / to-(グラデーション)、zinc と indigo 以外の Tailwind の色名((bg|text|border|ring|outline|fill|stroke)-(red|orange|amber|yellow|lime|green|emerald|teal|cyan|sky|blue|violet|purple|fuchsia|pink|rose|slate|gray|neutral|stone)-\d のような形)、rounded-full。また src/ に .tsx / .jsx ファイルと client: ディレクティブがあれば失敗にする。デザイン規律の出典は「画面・機能 > 共通のデザイン規律」の「色」と「動き」。誤検出を避けるため、Tailwind のクラスとして現れる形(単語の境界)で判定し、テストでは違反の例と、違反でない例(例: to- を含む普通の単語、transition-colors、duration-150)をそれぞれ持つ。'
  acceptance:
  - 今の src/ に対して npm test が通る
  - src/ の .astro に animate-spin、transition-all、duration-300、bg-gradient-to-r、from-zinc-50、text-red-500、rounded-full のどれかを入れると失敗する
  - transition-colors、duration-150、text-zinc-500、text-indigo-600 は失敗にならない
  - 'src/ に .tsx ファイル、または client:load などの client: ディレクティブを置くと失敗する'
  - 判定の関数に、違反の例と違反でない例の両方のテストケースがある
  - src/content の MDX の本文に transition や duration を含む英文があっても失敗しない
  depends_on:
  - T-003
  size: S
  human_check: ''
  status: todo
- id: T-005
  title: 整形の純粋関数(format.ts)と経歴の並べ替え
  milestone: M2
  request: '詳細設計「ディレクトリとモジュール」の src/lib/format.ts を作る。Astro のランタイムに依存しない純粋な TypeScript にする(「モジュールの境界」)。formatPeriod({ start, end }): ''YYYY-MM'' から年を取り「2025 – 2026」、end が ''present'' なら「2025 – Present」、開始と終了が同じ年なら「2025」(F-04、ユニットテスト format.test.ts)。formatYearMonth(''YYYY-MM'') → 「2024.04」(F-06 の表示「2024.04 – 2026.03」用)。formatDate(ISO の日時) → 「YYYY.MM.DD」(F-07 用。日付は JST で決める)。経歴を start の降順で並べる純粋関数 sortExperience(「データとコンテンツ > プロフィール・経歴」)も同じファイルに置く。tests/unit/format.test.ts を書く。'
  acceptance:
  - formatPeriod({start:'2025-04', end:'2026-03'}) が '2025 – 2026'(区切りは en dash と前後の空白)を返す
  - formatPeriod({start:'2025-04', end:'present'}) が '2025 – Present' を返す
  - formatPeriod({start:'2025-01', end:'2025-09'}) が '2025' を返す
  - formatYearMonth('2024-04') が '2024.04' を返す
  - formatDate('2025-01-01T00:30:00+09:00') が '2025.01.01' を返す
  - sortExperience が start の降順に並べ、元の配列を書き換えない
  - 'src/lib/format.ts が astro: で始まるモジュールを import していない'
  - npm test が通る
  depends_on:
  - T-003
  size: S
  human_check: ''
  status: todo
- id: T-006
  title: プロジェクトの frontmatter スキーマと selectFeatured
  milestone: M2
  request: '詳細設計「データとコンテンツ > プロジェクト」に従い、src/lib/schemas.ts に projectSchema(z は ''astro/zod'' から import)を、src/lib/projects.ts に selectFeatured() と sortProjects() を作る。projectSchema の制約: title は 1〜60文字、period は { start:''YYYY-MM'', end:''YYYY-MM''|''present'' } で end >= start、summary は 1〜100文字で改行なし、tech は string[] で 1〜8個かつ重複なし、outcomes は string[] で 1〜3個かつ各60文字以内、links は { demo?: url, github?: url } で https のみ、featured は boolean、order は 1 以上の整数。selectFeatured(projects) は featured のものだけを order の昇順で返し、featured が4件以上、または featured どうしで order が重なると throw する(「コレクションをまたぐ制約」)。sortProjects は order の昇順。どちらも Astro のランタイムに依存しない(「モジュールの境界」。''astro/zod'' は tests/unit から import できることを確かめる)。tests/unit/schemas.test.ts と tests/unit/projects.test.ts を「検証の方針 > ユニットテスト」のとおりに書く。'
  acceptance:
  - 正しい frontmatter が projectSchema を通る
  - '必須項目の欠落、summary が101文字、summary に改行、period の形式違い、end < start、tech が空、tech の重複、tech が9個、outcomes が4個、http: の URL のそれぞれで失敗する'
  - end が 'present' のとき start との大小の検査をしない
  - selectFeatured が featured でないものを除き、order の昇順で返す
  - featured が4件のとき、featured どうしで order が重なるときに throw する
  - npm test が通る
  depends_on:
  - T-003
  size: M
  human_check: ''
  status: todo
