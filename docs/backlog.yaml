  - 仮原稿の frontmatter の summary を101文字にすると npm run build が失敗する
  - src/content/projects/ に Index.mdx や index.mdx、foo_bar.mdx を置くと npm test が失敗する
  - '本文に行頭の「# 見出し」を書くと npm test が失敗する(コードブロック内の # コメントは失敗にならない)'
  - 仮原稿2件に TODO(content) があり、4章の h2、GFM の表、コードブロックがそれぞれ入っている
  - docs/project-template.mdx に4章の見出しと frontmatter の例があり、「# 」の見出しがない
